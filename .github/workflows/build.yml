name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: build · Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dsh-doctor.exe
        shell: pwsh
        run: ./tools/build.ps1
      - name: Run the built EXE
        shell: pwsh
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-build
        run: |
          New-Item -ItemType Directory -Force -Path $env:DSH_HOME | Out-Null
          ./dist/release/dsh-doctor.exe scan
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-doctor-windows
          path: dist/release/dsh-doctor.exe

  unix:
    name: build · Unix tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build dsh-doctor-unix.tar.gz
        shell: bash
        run: bash tools/package-unix.sh
      - name: Run the packaged CLI from the tarball
        shell: bash
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-build
        run: |
          set -euo pipefail
          mkdir -p "$DSH_HOME" "$RUNNER_TEMP/unpack"
          tar -xzf dist/release/dsh-doctor-unix.tar.gz -C "$RUNNER_TEMP/unpack"
          sh "$RUNNER_TEMP/unpack/dsh-doctor.sh" scan
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-doctor-unix
          path: dist/release/dsh-doctor-unix.tar.gz

  pluginpack:
    name: build · plugin bundle zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip the plugin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          cd plugin
          zip -r ../dist/release/dsh-doctor-plugin.zip . -x 'node_modules/*'
      - name: Sanity check the zip
        shell: bash
        run: |
          unzip -l dist/release/dsh-doctor-plugin.zip | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-doctor-pluginzip
          path: dist/release/dsh-doctor-plugin.zip

  envpack:
    name: build · Windows environment pack (node inside)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download portable Node
        shell: pwsh
        run: |
          $version = 'v20.18.0'
          Invoke-WebRequest -Uri "https://nodejs.org/dist/$version/node-$version-win-x64.zip" -OutFile node.zip
          Expand-Archive -Path node.zip -DestinationPath node -Force
      - name: Assemble the pack
        shell: pwsh
        run: |
          $pack = 'dist/envpack'
          New-Item -ItemType Directory -Force -Path "$pack/plugin/lib" | Out-Null
          $nodeExe = Get-ChildItem -Path node -Recurse -Filter node.exe | Select-Object -First 1
          Copy-Item $nodeExe.FullName "$pack/node.exe"
          $cli = [IO.File]::ReadAllText('tools/cli.mjs', [Text.Encoding]::UTF8)
          $cli = $cli.Replace("'../plugin/lib/index.js'", "'./plugin/lib/index.mjs'")
          $utf8 = New-Object Text.UTF8Encoding($false)
          [IO.File]::WriteAllText("$pack/dsh-doctor.mjs", $cli, $utf8)
          Copy-Item 'plugin/lib/index.js' "$pack/plugin/lib/index.mjs"
          Copy-Item 'plugin/package.json' "$pack/plugin/package.json"
          # .cmd 不能带 BOM（cmd.exe 会把 BOM 当命令的一部分）。
          $launcher = "@echo off`r`nchcp 65001 >nul`r`nsetlocal`r`ncd /d `"%~dp0`"`r`n`"%~dp0node.exe`" `"%~dp0dsh-doctor.mjs`" %*`r`necho.`r`npause`r`n"
          [IO.File]::WriteAllText("$pack/start.cmd", $launcher, $utf8)
          $readme = "DSH 私人医生 · Windows 环境包`r`n================================`r`n`r`n这个包自带 node.exe，不需要另外安装 Node，也不需要 DSH 能启动。`r`n`r`n用法：`r`n  1. 解压到任意目录（不要放在桌面，避免图标被刷新）；`r`n  2. 双击 start.cmd；`r`n  3. 选 1 体检，或按菜单提示操作。`r`n`r`n命令行：`r`n  node.exe dsh-doctor.mjs scan`r`n  node.exe dsh-doctor.mjs fix workspace-entry`r`n  node.exe dsh-doctor.mjs report`r`n`r`n全部在本机运行，不上传任何数据。`r`n"
          [IO.File]::WriteAllText("$pack/README.txt", $readme, $utf8)
          Compress-Archive -Path "$pack/*" -DestinationPath dist/dsh-doctor-env-win-x64.zip -Force
      - name: Run the environment pack
        shell: pwsh
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-envpack
        run: |
          New-Item -ItemType Directory -Force -Path $env:DSH_HOME | Out-Null
          New-Item -ItemType Directory -Force -Path dist/envrun | Out-Null
          Expand-Archive -Path dist/dsh-doctor-env-win-x64.zip -DestinationPath dist/envrun -Force
          & ./dist/envrun/node.exe ./dist/envrun/dsh-doctor.mjs scan
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-doctor-envpack
          path: dist/dsh-doctor-env-win-x64.zip

  release:
    name: publish · GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, unix, envpack, pluginpack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true
      - name: List assets
        run: ls -la dist/release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/dsh-doctor.exe
            dist/release/dsh-doctor-unix.tar.gz
            dist/release/dsh-doctor-env-win-x64.zip
            dist/release/dsh-doctor-plugin.zip
          fail_on_unmatched_files: false
